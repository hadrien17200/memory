name: Memory Workflow

on:
  push:
    branches:
      - develop

jobs:
  test-memory-2026:
    name: Test JPEG files
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check JPG files
        run: |
          for file in $(find . -type f -name "*.jpg"); do
            file "$file"
          done

  build-memory-2026:
    name: Build Docker Image
    runs-on: self-hosted
    needs: test-memory-2026
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t hadrien17200/memory-2026 .

  push-memory-2026:
    name: Push Docker Image
    runs-on: self-hosted
    needs: build-memory-2026
    steps:
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        run: docker push <username>/memory-2026

  deploy-memory-2026:
    name: Deploy via docker-compose on runner
    runs-on: self-hosted
    needs: push-memory-2026
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy with docker-compose
        run: |
          cd /home/hadrien/TpMemory/memory
          docker-compose pull
          docker-compose down
          docker-compose up -d --build
